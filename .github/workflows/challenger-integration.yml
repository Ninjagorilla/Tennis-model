name: Challenger tennis live integration
on:
  push:
    branches:
      - 'challenger/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: challenger-tennis-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-scan:
    if: github.repository == 'Ninjagorilla/Tennis-model'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.11'
      - name: Security audit and Node regression tests
        run: |
          npm run audit
          npm test
      - name: Install pinned inference and test dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Python regression tests
        env:
          PYTHONPATH: nfl:nfl/engine
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Verify rollback safety against frozen registered models
        run: |
          git fetch --no-tags origin 69d997c4c6a1f8765f05014fdb6a898d8701bd91 --depth=1
          python scripts/verify_rollback.py --target 69d997c4c6a1f8765f05014fdb6a898d8701bd91
      - name: Execute actual three-model tennis scan with bounded recovery
        env:
          REQUIRE_LIVE_SCAN: '1'
        run: python scripts/recovery_controller.py
      - name: Reject blocked scan, duplicate fixtures or corrupted Challenger diagnostics
        run: python scripts/verify_scan.py work/snapshot.json --require-available
      - name: Validate public status schema
        run: npm run build
      - name: Retain sanitized scan and coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: challenger-tennis-diagnostics-${{ github.run_id }}
          path: |
            work/snapshot.json
            work/scan-quality.json
            work/recovery-report.json
          retention-days: 7
          if-no-files-found: ignore
