name: Tennis dashboard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
permissions:
  contents: read
concurrency:
  group: tennis-dashboard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Ninjagorilla/Tennis-model' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Audit public files
        run: npm run audit
      - name: Test fail-closed model gates
        run: npm test
      - name: Build public status dashboard
        run: npm run build
      - name: Explain inference status
        run: |
          echo '### Dashboard built; cloud predictions blocked' >> "$GITHUB_STEP_SUMMARY"
          echo 'Recovered models were checked locally. No cloud runtime source or current slate is configured. No probabilities were generated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only public dashboard
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
