name: Tennis and NFL forecasts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: tennis-dashboard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    outputs:
      evidence_alert: ${{ steps.evidence_status.outputs.alert }}
      settlement_alert: ${{ steps.tennis_health.outcome == 'failure' }}
      weekly_audit_alert: ${{ steps.weekly_tennis_audit.outcome == 'failure' }}
    if: github.repository == 'Ninjagorilla/Tennis-model' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Audit sanitized public files
        run: npm run audit
      - name: Verify required recovery pipeline files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = ['scripts/recovery_controller.py', 'scripts/verify_scan.py', 'scripts/forecast_ledger.py', 'scripts/gh_evidence.py', 'scripts/evidence_resilience.py', 'scripts/settlement_health.py', 'scripts/seven_day_tennis_audit.py']
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit('Missing required recovery components: ' + ', '.join(missing))
          print('Recovery component preflight passed')
          PY
      - name: Install pinned inference and test dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Test publication, fixture and settlement gates
        env:
          PYTHONPATH: nfl:nfl/engine
        run: |
          npm test
          python -m unittest discover -s test -p 'test_*.py'
          python -m pytest nfl/tests -q
          python -m pytest test/test_prop_outcomes.py -q
      - name: Verify rollback baseline preserves registered tennis and NFL models
        run: |
          git fetch --no-tags origin 69d997c4c6a1f8765f05014fdb6a898d8701bd91 --depth=1
          python scripts/verify_rollback.py --target 69d997c4c6a1f8765f05014fdb6a898d8701bd91
      - name: Verify tennis models and score current matches
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python scripts/recovery_controller.py
      - name: Validate tennis scan identities, missing coverage and challenger integrity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python scripts/verify_scan.py work/snapshot.json
      - name: Capture immutable pre-match tennis forecasts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if python -c "import json; exit(0 if json.load(open('work/snapshot.json'))['prediction_status']=='available' else 1)"; then
            python scripts/forecast_ledger.py work/snapshot.json --output work/tennis-forecast-ledger.jsonl
          else
            echo "No available predictions to archive; no invented evidence."
          fi
      - name: Archive tennis evidence to verified primary and mirror branches
        id: tennis_archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s work/tennis-forecast-ledger.jsonl ]; then
            python scripts/gh_evidence.py work/tennis-forecast-ledger.jsonl
          else
            echo "No pre-match records; leaving archive unchanged."
          fi
      - name: Verify and automatically repair archived evidence mirrors
        id: evidence_repair
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.tennis_archive.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s work/evidence-archive-report.json ]; then
            python scripts/evidence_resilience.py work/evidence-archive-report.json
          fi
      - name: Report evidence persistence failure
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.tennis_archive.outcome == 'failure'
        run: |
          echo "::warning::GitHub evidence branches unavailable; 90-day Actions artifact is fallback, not permanent archive."
          echo "Tennis evidence branch replication failed; investigate work/evidence-archive-report.json." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain independent tennis evidence backup
        id: evidence_artifact
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: tennis-evidence-${{ github.run_id }}
          path: |
            work/tennis-forecast-ledger.jsonl
            work/evidence-archive-report.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Set explicit evidence alert state
        id: evidence_status
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -s work/snapshot.json ]; then
            echo 'alert=true' >> "$GITHUB_OUTPUT"
            echo '::warning::Pipeline blocked before a fresh tennis snapshot was produced; archive and settlement state unverified.'
          elif [ -s work/tennis-forecast-ledger.jsonl ] && { [ "${{ steps.tennis_archive.outcome }}" != "success" ] || [ "${{ steps.evidence_repair.outcome }}" != "success" ] || [ "${{ steps.evidence_artifact.outcome }}" != "success" ]; }; then
            echo 'alert=true' >> "$GITHUB_OUTPUT"
            echo "::warning::Evidence recovery degraded: inspect archived report, repair status, and artifact."
          else
            echo 'alert=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Select daily tennis result reconciliation
        id: tennis_grade_window
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ] || { [ "$(date -u +%H)" = "09" ] && [ "${{ github.event_name }}" = "schedule" ]; }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Collect independent ESPN and Tennis.com outcomes and grade archived forecasts
        id: tennis_settlement
        if: steps.tennis_grade_window.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/retrieve_evidence.py
          python scripts/tennis_result_sources.py work/historical-forecasts.json
      - name: Persist verified two-source settlement receipts
        id: tennis_result_archive
        if: steps.tennis_settlement.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/archive_results.py work/settlement-observations.json
      - name: Validate end-to-end two-source settlement and archive health
        id: tennis_health
        if: always() && steps.tennis_grade_window.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/settlement_health.py
      - name: Reconcile seven-day archived forecasts and verified results
        id: weekly_tennis_audit
        if: always() && steps.tennis_grade_window.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/seven_day_tennis_audit.py
      - name: Retain seven-day prospective research audit
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: tennis-seven-day-audit-${{ github.run_id }}
          path: work/seven-day-tennis-audit.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Retain settlement audit and provider health
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: tennis-settlement-${{ github.run_id }}
          path: |
            work/historical-forecasts.json
            work/settlement-observations.json
            work/result-archive-report.json
            work/settlement-health.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Retain sanitized tennis diagnostic report
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tennis-quality-${{ github.run_id }}
          path: |
            work/snapshot.json
            work/scan-quality.json
            work/recovery-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Run complete NFL engine and grade paper forecasts
        id: nfl
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python nfl/pipeline.py
      - name: Grade verified player-stat research thresholds
        if: steps.nfl.outcome == 'success'
        continue-on-error: true
        run: python -m nfl.prop_outcomes
      - name: Select bounded daily paper retention
        id: retention
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(date -u +%H)" = "09" ]; then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo 'save=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Carry unresolved paper forecasts and cumulative grades forward
        if: steps.retention.outputs.save == 'true' && steps.nfl.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nfl-paper-${{ github.run_id }}
          path: work/nfl/paper_archive
          retention-days: 14
          if-no-files-found: error
      - name: Retain shadow sensitivity reports for review
        if: steps.retention.outputs.save == 'true' && steps.nfl.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nfl-shadow-${{ github.run_id }}
          path: work/nfl/shadow
          retention-days: 1
          if-no-files-found: ignore
      - name: Build public forecast site
        run: npm run build
      - name: Build read-only tennis reliability dashboard
        run: python scripts/reliability_dashboard.py
      - name: Retain machine-readable reliability diagnostics
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: tennis-reliability-${{ github.run_id }}
          path: |
            work/reliability-dashboard.json
            work/evidence-recovery-health.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Record actual inference health
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json,os,pathlib
          d=json.load(open('work/snapshot.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Tennis inference: '+d['prediction_status']+'\n\n')
              f.write(str(len(d['matches']))+' current verified fixtures; partial coverage.\n\n')
              for m in d['models']:f.write(m['name']+': '+str(m['preflight']['passed'])+'/4 checks, '+str(m['predictions'])+' predictions.\n\n')
              p=pathlib.Path('work/nfl_snapshot.json')
              n=json.loads(p.read_text()) if p.exists() else {'execution_status':'blocked','paper_games':0}
              f.write('## NFL inference: '+n['execution_status']+'\n\n')
              f.write(str(n['paper_games'])+' games paper-run. Public probability gate CLOSED. No promotion or wagering.\n\n')
              f.write('Prospective grades: '+str(n.get('prospective',{}).get('unique_games_graded',0))+'.\n\n')
              f.write('Paper history restore: '+str(n.get('paper_history_restore',{}).get('status','unavailable'))+'.\n')
          PY
      - name: Publish independent tennis results channel
        continue-on-error: true
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: tennis_publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('dist/data/status.json').read_text())
          assert d['schema_version']==2 and isinstance(d['matches'],list)
          assert {m['id'] for m in d['models']}=={'champion','challenger','experimental'}
          assert d['prediction_status'] in {'available','unavailable','blocked'}
          PY
          # Never replace a last-known-good independent result with blocked output.
          # Keep the old timestamp/expiry so consumers can detect staleness.
          if [ "$(python -c "import json; print(json.load(open('dist/data/status.json'))['prediction_status'])")" != "available" ]; then
            echo "Current tennis scan unavailable; preserving independently published last-good result."
            exit 0
          fi
          sha="$(gh api "repos/$GH_REPO/contents/public-results/latest.json?ref=scan-results" --jq '.sha' 2>/dev/null || true)"
          export RESULTS_SHA="$sha"
          python - <<'PYCODE'
          import base64, json, os, pathlib
          payload={'message':'Publish tennis scan '+os.environ['GITHUB_RUN_ID'], 'branch':'scan-results',
                   'content':base64.b64encode(pathlib.Path('dist/data/status.json').read_bytes()).decode('ascii')}
          if os.environ.get('RESULTS_SHA'): payload['sha']=os.environ['RESULTS_SHA']
          pathlib.Path('work/results-upload.json').write_text(json.dumps(payload))
          PYCODE
          gh api -X PUT "repos/$GH_REPO/contents/public-results/latest.json" --input work/results-upload.json
      - name: Explain independent results publication failures
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.tennis_publish.outcome == 'failure'
        run: |
          echo "::warning::Independent results publication failed; investigate GitHub token permissions or scan-results branch."
          echo "Independent results publication failed. Pages may still work; inspect the publication step and retain prior snapshots." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy forecast site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  alert:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.build.result == 'failure' || needs.build.outputs.evidence_alert == 'true' || needs.build.outputs.settlement_alert == 'true' || needs.build.outputs.weekly_audit_alert == 'true')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open or update one actionable failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Tennis pipeline recovery needed"
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Tennis pipeline recovery needed") | .number' | head -n 1)"
          message="Production pipeline failed, evidence recovery remains degraded, independently verified settlement failed, or seven-day audit failed. Check $RUN_URL, tennis-reliability diagnostics and archive receipts. No stale or restored forecasts may be graded as new; Champion unchanged."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$message"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "$message"
          fi
