name: Tennis forecasts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: tennis-dashboard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Ninjagorilla/Tennis-model' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Audit sanitized public files
        run: npm run audit
      - name: Test publication and fixture gates
        run: |
          npm test
          python -m unittest discover -s test -p 'test_*.py'
      - name: Install pinned inference dependencies
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Verify models and score current matches
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python scripts/scan.py
      - name: Build public forecast site
        run: npm run build
      - name: Record actual inference health
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('work/snapshot.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Inference: '+d['prediction_status']+'\n\n')
              f.write(str(len(d['matches']))+' current verified fixtures; partial coverage.\n\n')
              for m in d['models']:f.write(m['name']+': '+str(m['preflight']['passed'])+'/4 checks, '+str(m['predictions'])+' predictions.\n\n')
          PY
      - name: Upload only public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy forecast site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
