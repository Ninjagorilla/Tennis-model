name: NFL integration validation
on:
  push:
    branches: [nfl-full-engine-integration-20261017]
    paths: ['.github/workflows/nfl-integration.yml', 'nfl/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nfl-integration-validation
  cancel-in-progress: false
jobs:
  integration:
    if: github.repository == 'Ninjagorilla/Tennis-model' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Audit public text and model hashes
        run: npm run audit
      - name: Install pinned runtime
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Test NFL and unchanged tennis gates
        env:
          PYTHONPATH: nfl:nfl/engine
        run: |
          mkdir -p work/ci
          npm test
          python -m unittest discover -s test -p 'test_*.py'
          python -m pytest nfl/tests -q
          python -m pytest test/test_prop_outcomes.py -q --junitxml=work/ci/nfl-tests.xml
      - name: Run full NFL engine with two-source pregame checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python nfl/pipeline.py
      - name: Validate real execution and closed publication gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('work/nfl/receipt.json'))
          s=json.load(open('work/nfl_snapshot.json'))
          assert r['execution_status']=='verified' and r['paper_games']>0
          assert r['public_forecasts']==0 and s['publication_approved'] is False
          assert s['games']==[]
          print(json.dumps(r,indent=2))
          PY
      - name: Build site without changing tennis models
        run: npm run build
      - name: Retain compact execution evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nfl-integration-evidence
          retention-days: 2
          if-no-files-found: error
          path: |
            work/ci/*.xml
            work/nfl/receipt.json
            work/nfl_snapshot.json
            work/nfl/paper_archive/*.json
            work/nfl/aggregate/aggregation_receipt.json
            work/nfl/first_td_dataset/dataset_report.json
            dist
