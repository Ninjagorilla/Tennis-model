name: NFL integration validation
on:
  push:
    branches: [nfl-full-engine-integration-20261017]
    paths: ['.github/workflows/nfl-integration.yml', 'nfl/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfl-integration-validation
  cancel-in-progress: false
jobs:
  dataset:
    if: github.repository == 'Ninjagorilla/Tennis-model' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install data readers
        run: python -m pip install pandas==2.2.3 pyarrow==21.0.0
      - name: Acquire historical and current public NFL data
        run: python nfl/acquire.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-input-snapshot
          path: nfl_inputs
          retention-days: 2
          if-no-files-found: error
