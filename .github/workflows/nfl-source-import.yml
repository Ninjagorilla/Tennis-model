name: Import verified NFL source
on:
  push:
    branches: [nfl-full-engine-integration-20261017]
    paths: ['.github/workflows/nfl-source-import.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'Ninjagorilla/Tennis-model' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nfl-full-engine-integration-20261017
      - name: Verify and write reviewed plain-text source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          blobs='''96b2501776c61c4bb31d337fa6495ec1aa04cb48 cffbbff84cc5822976016689c53e648fb7de9a42 f1928f06a86e01bdccd5f41238ec119a2ec09317 7cf42b8ec5dc6e29d81a8d1c80f2d0d95c319a60 e074a943c02849b646dd256b14bb3aae29722783 44325fbb73934f9963b3e103098fd04d59ae4216 1efa34d2734f1444a6b901b665afcf9e6b9321e0 fef396929654268eabfeb6c37061dd214ec95b7c da281f5ea58f6c06389dd44f62f1dc7aaf000555 9bab7457f5a4fbbcc98998fc4a7b59dfeea183a9 46043828beacc8cdc9a3c768ada3a77a5c3d8e37 edc9c6df0014dcd000f185a75db2a368e343330e 4c2443c67fdd39c5e2995611646020944ae55d77 1e9e0beb55f642066ecd671107537d0a559825e8 7584b526644b117a8f10c844960e41cd4d9fe0a9'''.split()
          fragments=[]
          for sha in blobs:
              url='https://api.github.com/repos/Ninjagorilla/Tennis-model/git/blobs/'+sha
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.loads(r.read(50000))
              assert data['sha']==sha and data['encoding']=='base64'
              fragment=base64.b64decode(data['content'])
              assert len(fragment)<=8000
              assert hashlib.sha1(b'blob '+str(len(fragment)).encode()+b'\0'+fragment).hexdigest()==sha
              fragments.append(fragment)
          compressed=base64.b64decode(b''.join(fragments),validate=True)
          assert len(compressed)==84200
          assert hashlib.sha256(compressed).hexdigest()=='b6ee3c0290bb337eb653cdf5af7cc5fc110cc3af9413b691cb3156a7f1a936d2'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(compressed,max_length=400000)
          assert decoder.eof and len(raw)==328419
          files=json.loads(raw)
          assert isinstance(files,dict) and len(files)==51
          allowed={'ATTRIBUTION.md','README.md','requirements.txt','scripts/audit.mjs','scripts/build.mjs','scripts/nfl-status.mjs','site/index.html','site/nfl.css','site/nfl.html','site/nfl.js','test/nfl-status.test.mjs'}
          root=pathlib.Path.cwd().resolve()
          for name,content in files.items():
              p=pathlib.Path(name)
              assert isinstance(content,str) and not p.is_absolute() and '..' not in p.parts
              assert name.startswith('nfl/') or name in allowed
              assert p.suffix in {'.py','.json','.md','.txt','.mjs','.css','.html','.js'}
              assert not p.is_symlink() and (root/p).resolve().is_relative_to(root)
              assert len(content.encode())<4*1024*1024
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding='utf-8')
          subprocess.run(['git','add','--',*files.keys()],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Add full NFL engine, fitted first-TD research, tests and gated site'],check=True)
          subprocess.run(['git','push','origin','HEAD:nfl-full-engine-integration-20261017'],check=True)
          print('Verified 51 plain-text files. Tennis engine artifacts unchanged. Public NFL forecast gate remains closed.')
          PY
