name: Tennis independent recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '23,53 * * * *'
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: tennis-independent-recovery
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Run isolated tennis recovery
        env:
          REQUIRE_CHALLENGER_COVERAGE: '1'
        id: inference
        continue-on-error: true
        run: python scripts/recovery_controller.py
      - name: Validate and publish current tennis result
        if: steps.inference.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_tennis_snapshot.py
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tennis-independent-${{ github.run_id }}
          path: |
            work/snapshot.json
            work/recovery-report.json
            work/scan-quality.json
          retention-days: 14
          if-no-files-found: warn
      - name: Fail when recovery exhausted
        if: steps.inference.outcome != 'success'
        run: exit 1
  alert:
    needs: scan
    if: always() && needs.scan.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Record actionable failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Tennis independent recovery failed'
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Tennis independent recovery failed") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "Independent tennis runner failed: $RUN_URL"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "Independent tennis runner failed: $RUN_URL"
          fi
