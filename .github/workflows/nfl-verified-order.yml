name: NFL verified first-TD chronology
on:
  pull_request:
    paths:
      - 'nfl/verified_pbp_order.py'
      - 'nfl/tests/test_verified_pbp_order.py'
      - '.github/workflows/nfl-verified-order.yml'
  push:
    branches: [main]
    paths:
      - 'nfl/verified_pbp_order.py'
      - 'nfl/tests/test_verified_pbp_order.py'
      - '.github/workflows/nfl-verified-order.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  order-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify first-TD ordering and missing evidence abstention
        env:
          PYTHONPATH: nfl
        run: python -m unittest discover -s nfl/tests -p 'test_verified_pbp_order.py' -v
